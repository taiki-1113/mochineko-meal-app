name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site/icons _site/assets/character _site/assets/audio _site/assets/background _site/assets/fonts
          cp index.html styles.css app.js audio.js messages.js manifest.webmanifest sw.js _site/
          cp icons/icon.svg _site/icons/
          cp assets/character/stage-*.png assets/character/manifest.json _site/assets/character/
          cp assets/audio/*.wav _site/assets/audio/
          cp assets/background/*.png _site/assets/background/
          cp assets/fonts/*.ttf assets/fonts/*.txt _site/assets/fonts/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
